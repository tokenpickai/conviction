name: pages

on:
  workflow_run:
    workflows:
      - hourly-sync
      - daily-prices
    types:
      - completed
  push:
    branches:
      - main
    paths:
      - "data/**"
      - "assets/**"
      - "scripts/serenity_render.py"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Render dashboard
        run: |
          python scripts/serenity_render.py
          python scripts/audit_reason_translations.py
          mkdir -p public
          latest="$(ls -t serenity-tracker-*.html | head -n 1)"
          cp "$latest" public/index.html
          cp "$latest" "public/$latest"
          cp -R assets public/assets
          echo "serenity.xconviction.com" > public/CNAME

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - id: deployment
        uses: actions/deploy-pages@v4
