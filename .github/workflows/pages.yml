name: pages

on:
  workflow_run:
    workflows:
      - hourly-sync
      - daily-prices
    types:
      - completed
  push:
    branches:
      - main
    paths:
      - "data/**"
      - "assets/**"
      - "profiles/**"
      - "scripts/serenity_render.py"
      - "scripts/build_site.py"
      - "scripts/profile_config.py"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Render dashboard
        run: |
          python scripts/build_site.py
          python scripts/audit_reports.py --profile serenity
          python scripts/audit_reason_translations.py --profile serenity
          latest="$(ls -t dist/serenity/serenity-tracker-*.html | head -n 1)"
          python scripts/smoke_report_render.py --html "$latest"

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - id: deployment
        uses: actions/deploy-pages@v4
