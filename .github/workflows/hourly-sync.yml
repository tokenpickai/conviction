name: hourly-sync

on:
  # Uncomment the schedule after forking and configuring your secrets:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

concurrency:
  group: serenity-data-push
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ hashFiles('requirements.txt') }}

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch new tweets
        env:
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
        run: |
          python scripts/fetch_tweets.py --profile serenity
          python scripts/fetch_tweets.py --profile jukan

      - name: Extract opinions (LLM, recent 7d only)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          since="$(date -u -d '7 days ago' +%Y-%m-%d)"
          python scripts/extract.py --profile serenity --since "$since"
          python scripts/extract.py --profile jukan --since "$since" --model claude-sonnet-4-6

      - name: Rebuild stock database
        run: |
          python scripts/build_db.py --profile serenity
          python scripts/build_db.py --profile jukan

      - name: Verify data
        run: |
          python scripts/verify_data.py --profile serenity
          python scripts/verify_data.py --profile jukan

      - name: Translate new Jukan reason snippets
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/translate_reason_snippets.py --profile jukan --all-tickers --model claude-sonnet-4-6

      - name: Check report update candidates
        run: |
          python scripts/check_report_updates.py --profile serenity
          python scripts/check_report_updates.py --profile jukan

      - name: Apply report updates
        run: |
          python scripts/apply_report_updates.py --profile serenity
          python scripts/apply_report_updates.py --profile jukan

      - name: Refresh report update candidates
        run: |
          python scripts/check_report_updates.py --profile serenity
          python scripts/check_report_updates.py --profile jukan

      - name: Build report queue
        run: |
          python scripts/build_report_queue.py --profile serenity
          python scripts/build_report_queue.py --profile jukan

      - name: Build report decisions
        run: |
          python scripts/build_report_decisions.py --profile serenity
          python scripts/build_report_decisions.py --profile jukan

      - name: Validate reports
        run: |
          python scripts/validate_reports.py --profile serenity
          python scripts/validate_reports.py --profile jukan

      - name: Audit reports
        run: |
          python scripts/audit_reports.py --profile serenity
          python scripts/audit_reports.py --profile jukan
          python scripts/audit_reason_translations.py --profile jukan --all-tickers

      - name: Commit updated data
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add data/
          git diff --cached --quiet || git commit -m "Sync $(date -u +%Y-%m-%dT%H:%M)"
          git push
